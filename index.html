<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeeMyDriver Fleet | Command Center</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>

    <!-- Mapbox GL JS CSS & JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Custom Styling Overrides -->
    <style>
        .mapboxgl-popup-content { background: #12141c !important; color: #fff !important; border-radius: 12px; border: 1px solid #262626; padding: 14px !important; }
        .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #12141c !important; }
        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #12141c !important; }
        .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #12141c !important; }
        .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #12141c !important; }
        .pro-vehicle-marker { background: transparent !important; border: none !important; cursor: pointer; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col font-sans selection:bg-amber-400 selection:text-black antialiased">

    <!-- HEADER / NAVBAR -->
    <header class="w-full border-b border-neutral-900 bg-black/90 backdrop-blur-md z-50 px-4 sm:px-8 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-12 h-12 sm:w-14 sm:h-14 bg-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(251,191,36,0.5)] shrink-0 overflow-hidden">
                <span class="text-black font-black text-xl sm:text-2xl">👀</span>
            </div>
            <span class="font-black tracking-tight text-2xl sm:text-3xl text-white">See<span class="text-amber-400">MyDriver</span> <span class="text-xs px-2.5 py-1 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20 ml-2 font-mono">FLEET COMMAND</span></span>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <span id="connection-status" class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
            </span>
        </div>
