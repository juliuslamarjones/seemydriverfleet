<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeeMyDriver Fleet | Command Center</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>

    <!-- Mapbox GL JS CSS & JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Custom Styling Overrides -->
    <style>
        .mapboxgl-popup-content { background: #12141c !important; color: #fff !important; border-radius: 12px; border: 1px solid #262626; padding: 14px !important; }
        .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #12141c !important; }
        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #12141c !important; }
        .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #12141c !important; }
        .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #12141c !important; }
        .pro-vehicle-marker { background: transparent !important; border: none !important; cursor: pointer; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col font-sans selection:bg-amber-400 selection:text-black antialiased">

    <!-- HEADER / NAVBAR -->
    <header class="w-full border-b border-neutral-900 bg-black/90 backdrop-blur-md z-50 px-4 sm:px-8 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-12 h-12 sm:w-14 sm:h-14 bg-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(251,191,36,0.5)] shrink-0 overflow-hidden">
                <span class="text-black font-black text-xl sm:text-2xl">👀</span>
            </div>
            <span class="font-black tracking-tight text-2xl sm:text-3xl text-white">See<span class="text-amber-400">MyDriver</span> <span class="text-xs px-2.5 py-1 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/20 ml-2 font-mono">FLEET COMMAND</span></span>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <span id="connection-status" class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
            </span>
        </div>
    </header>

    <!-- MAIN APP CONTAINER (SPLIT VIEW) -->
    <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        
        <!-- LEFT SIDEBAR: DRIVER ROSTER -->
        <aside class="w-full md:w-96 bg-[#0f1117] border-r border-neutral-900 flex flex-col z-10 shrink-0 h-1/3 md:h-full">
            <div class="p-4 border-b border-neutral-900 flex items-center justify-between bg-black/40">
                <span class="text-xs font-black uppercase tracking-wider text-neutral-400">Active Fleet Roster</span>
                <span id="driver-count" class="text-xs bg-neutral-900 text-amber-400 px-3 py-1 rounded-full font-mono border border-neutral-800">0 Active</span>
            </div>

            <!-- Driver List Container -->
            <div id="driver-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-xs text-neutral-500 text-center py-8 font-mono">Listening for active broadcasts...</div>
            </div>

            <!-- Global View Reset Footer -->
            <div class="p-4 border-t border-neutral-900 bg-black/40">
                <button onclick="resetFleetView()" class="w-full bg-neutral-900 hover:bg-neutral-800 text-neutral-300 hover:text-white text-xs font-bold py-3 rounded-xl border border-neutral-800 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-inner">
                    <span>↺ Reset to Fleet Overview</span>
                </button>
            </div>
        </aside>

        <!-- RIGHT MAP CONTAINER (MAPBOX GL VECTOR) -->
        <main class="flex-1 relative bg-neutral-950 h-2/3 md:h-full">
            <div id="map" class="w-full h-full z-0"></div>
        </main>
    </div>

    <script>
        // --- FIREBASE & MAPBOX INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAfT3ZCE8DEmjsf4FLIqDgdYIQL1woIJOI",
            authDomain: "seemydriver-prod.firebaseapp.com",
            databaseURL: "https://seemydriver-prod-default-rtdb.firebaseio.com",
            projectId: "seemydriver-prod",
            storageBucket: "seemydriver-prod.firebasestorage.app",
            messagingSenderId: "16366013329",
            appId: "1:16366013329:web:7e993e6ee37f940a04a064"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Mapbox Token (Corrected from tracker.js)
        mapboxgl.accessToken = 'pk.eyJ1Ijoic29ubnlqb25lczIwMTQiLCJhIjoiY212NHExMmxjMTBmODJ3cHh5cmcxbmZyZSJ9.wq8EANp8vooYz3gE2o4Krg';

        let map;
        let activeMarkers = {}; 
        let fleetData = {};

        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/streets-v12', 
                center: [-95.2831, 29.9731],
                zoom: 12
            });

            map.addControl(new mapboxgl.NavigationControl(), 'top-right');

            map.on('load', () => {
                initFirebaseListeners();
            });
        }

        // --- REAL-TIME FIREBASE DATABASE LISTENERS ---
        function initFirebaseListeners() {
            const broadcastsRef = db.ref('broadcasts');

            broadcastsRef.on('value', (snapshot) => {
                const val = snapshot.val();
                fleetData = val || {};
                renderFleetRosterAndMarkers();
            }, (error) => {
                console.error("Firebase sync error:", error);
                document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Disconnected';
                document.getElementById('connection-status').className = 'text-xs font-mono text-red-400 bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/20 flex items-center gap-1.5';
            });
        }

        // --- TRUCK SVG MARKER ASSET ---
        function createTruckElement(accentColor) {
            const el = document.createElement('div');
            el.className = 'pro-vehicle-marker';
            el.style.width = '40px';
            el.style.height = '40px';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.filter = 'drop-shadow(0px 6px 12px rgba(0,0,0,0.6))';
            el.innerHTML = `
                <svg viewBox="0 0 24 36" width="32" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1.5" y="9" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>
                    <rect x="19" y="9" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>
                    <rect x="1.5" y="25" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>
                    <rect x="19" y="25" width="3.5" height="7" rx="1" fill="#090d16" stroke="${accentColor}" stroke-width="1"/>
                    <rect x="4" y="12" width="16" height="21" rx="2.5" fill="#0b0f19" stroke="${accentColor}" stroke-width="1.5"/>
                    <rect x="4" y="21" width="16" height="3.5" fill="#fbbf24"/>
                    <line x1="4" y1="22.75" x2="20" y2="22.75" stroke="#ffffff" stroke-width="0.75" opacity="0.8"/>
                    <path d="M6 12H18V5.5C18 3.84315 16.6569 2.5 15 2.5H9C7.34315 2.5 6 3.84315 6 5.5V12Z" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
                    <path d="M7.5 8H16.5L15.5 4.5H8.5L7.5 8Z" fill="#38bdf8" fill-opacity="0.9" stroke="#bae6fd" stroke-width="0.5"/>
                    <line x1="9" y1="6" x2="15" y2="6" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
                    <circle cx="7" cy="3.5" r="1.1" fill="#fbbf24"/>
                    <circle cx="17" cy="3.5" r="1.1" fill="#fbbf24"/>
                    <circle cx="7" cy="3.5" r="0.5" fill="#ffffff"/>
                    <circle cx="17" cy="3.5" r="0.5" fill="#ffffff"/>
                </svg>
            `;
            return el;
        }

        // --- RENDER LIVE ROSTER & MAPBOX MARKERS FROM FIREBASE ---
        function renderFleetRosterAndMarkers() {
            const listContainer = document.getElementById('driver-list');
            listContainer.innerHTML = '';

            const sessionIds = Object.keys(fleetData);
            const activeSessions = sessionIds.filter(id => {
                const d = fleetData[id];
                if (!d) return false;
                const lat = Number(d.lat || d.latitude || d.destLat);
                const lng = Number(d.lng || d.lon || d.longitude || d.destLng);
                return isFinite(lat) && isFinite(lng);
            });

            document.getElementById('driver-count').innerText = `${activeSessions.length} Active`;

            if (activeSessions.length === 0) {
                listContainer.innerHTML = '<div class="text-xs text-neutral-500 text-center py-8 font-mono">Listening for active broadcasts...</div>';
                Object.keys(activeMarkers).forEach(id => {
                    activeMarkers[id].marker.remove();
                    delete activeMarkers[id];
                });
                return;
            }

            const currentMarkerIds = new Set(activeSessions);
            Object.keys(activeMarkers).forEach(id => {
                if (!currentMarkerIds.has(id)) {
                    activeMarkers[id].marker.remove();
                    delete activeMarkers[id];
                }
            });

            activeSessions.forEach((sid, index) => {
                const driver = fleetData[sid];
                const accentColors = ['#fbbf24', '#3b82f6', '#10b981', '#f43f5e', '#a855f7'];
                const color = accentColors[index % accentColors.length];

                const lat = Number(driver.lat || driver.latitude || driver.destLat);
                const lng = Number(driver.lng || driver.lon || driver.longitude || driver.destLng);
                const driverName = driver.driverName || 'Active Driver';
                const address = driver.custAddress || driver.destAddress || 'Custom Destination';
                const speed = driver.speed || 0;

                // 1. Build Sidebar Card
                const card = document.createElement('div');
                card.className = `bg-[#12141c] hover:bg-[#161923] border border-neutral-800 p-4 rounded-2xl cursor-pointer transition-all shadow-lg flex flex-col gap-2`;
                card.style.borderLeft = `4px solid ${color}`;
                card.onclick = () => selectDriver(sid);
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-black text-white text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full" style="background: ${color};"></span>
                            ${driverName}
                        </span>
                        <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/20">En Route</span>
                    </div>
                    <p class="text-xs text-neutral-400 font-medium truncate">Dest: ${address}</p>
                    <div class="flex items-center justify-between text-xs font-mono text-neutral-400 pt-1 border-t border-neutral-800/60">
                        <span>Speed: <strong style="color: ${color};">${speed} mph</strong></span>
                        <span>Live Telemetry</span>
                    </div>
                `;
                listContainer.appendChild(card);

                // 2. Update or Create Mapbox Marker
                const lngLat = [lng, lat];
                const popupHtml = `<b style="color:${color}; font-size:14px;">${driverName}</b><br><span style="color:#a3a3a3">Speed: ${speed} mph</span><br>Dest: <b>${address}</b>`;

                if (activeMarkers[sid]) {
                    activeMarkers[sid].marker.setLngLat(lngLat);
                    activeMarkers[sid].marker.getPopup().setHTML(popupHtml);
                } else {
                    const el = createTruckElement(color);
                    const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml);
                    const marker = new mapboxgl.Marker(el)
                        .setLngLat(lngLat)
                        .setPopup(popup)
                        .addTo(map);

                    el.addEventListener('click', () => selectDriver(sid));
                    activeMarkers[sid] = { marker, driver };
                }
            });
        }

        // --- SELECT DRIVER (ZOOM & FLY) ---
        function selectDriver(sid) {
            const data = activeMarkers[sid] || fleetData[sid];
            if (!data) return;
            const driver = data.driver || data;
            const lat = Number(driver.lat || driver.latitude || driver.destLat);
            const lng = Number(driver.lng || driver.lon || driver.longitude || driver.destLng);

            map.flyTo({
                center: [lng, lat],
                zoom: 15,
                essential: true,
                duration: 1200
            });

            if (activeMarkers[sid] && activeMarkers[sid].marker) {
                activeMarkers[sid].marker.togglePopup();
            }
        }

        // --- RESET VIEW BACK TO OVERVIEW ---
        function resetFleetView() {
            map.flyTo({
                center: [-95.2831, 29.9731],
                zoom: 12,
                essential: true,
                duration: 1000
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
